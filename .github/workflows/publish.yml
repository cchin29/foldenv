name: Publish to PyPI

# Publishes on a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored. One-time PyPI setup:
#   PyPI → your account → Publishing → add a "pending publisher":
#     PyPI project name: foldenv
#     Owner: cchin29   Repository: foldenv
#     Workflow name: publish.yml   Environment: pypi
# Remember to bump `version` in pyproject.toml before tagging (PyPI rejects re-uploads).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
