# Locked decisions for `get_structural_context` (D1-D6).
# These are the "reasonable defaults"; every value is overridable via config.load(overrides=...).
# Record which values were used in any results writeup (several shift absolute numbers).

# D1 — contact cutoff. Cα-8 Å is the primary burial/packing measure; Cβ-5 Å is reported
# alongside in validation. `primary` selects which drives `contact_count`/`nearest_contacts`.
contacts:
  primary: ca            # "ca" (Cα–Cα ≤ ca_cutoff) or "cb" (Cβ–Cβ ≤ cb_cutoff)
  ca_cutoff: 8.0         # Å
  cb_cutoff: 5.0         # Å
  n_nearest: 5           # size of `nearest_contacts` list
  glycine_cb_fallback: ca  # glycine has no Cβ → use Cα ("ca") for its contacts

# D2 — pLDDT masking. Residues below the threshold are excluded as contact *partners*
# (AF disordered loops produce spurious contacts); the queried residue's own pLDDT is
# always returned regardless.
plddt:
  mask_below: 50.0       # 0–100 scale (AF: <50 = very low / likely disordered)

# D3 — RSA normalization. RSA = ASA / MaxASA(residue_type). Record the table used;
# tables shift absolute RSA unevenly: mean |ΔRSA| 0.012 vs tien2013_empirical and 0.047 vs
# sander_rost1994, with 17% of residues moving >0.10 against the latter and almost none
# against the former (TEM-1, n=286).
#   tien2013_theoretical | tien2013_empirical | sander_rost1994
rsa:
  max_asa_table: tien2013_theoretical
  buried_threshold: 0.20   # RSA ≲ 0.20 → buried (reporting convenience only)
  exposed_threshold: 0.25  # RSA ≳ 0.25 → exposed

# D4 — caching. AF files cached on disk by accession; parsed structure + DSSP + the one
# PLM pass held in memory per protein so many positions of the same protein are cheap.
cache:
  dir: null              # null → <cwd>/.foldenv_cache (gitignored)
  in_memory: true        # L1: per-protein derived objects held in-process
  # L2: also persist the two expensive derived artifacts — DSSP and the
  # per-protein PLM embedding — to disk under `dir`, so a multi-protein × multi-config sweep
  # doesn't re-run mkdssp / the forward pass every fresh process. Set false (the opt-out
  # escape) for correctness runs that must recompute from scratch.
  persist: true

# D5 — embedding model. Default is Ankh-large (1536-d) because that is MuLAN's default, and
# foldenv was extracted from work with MuLAN: keeping the same encoder means embeddings computed
# here match that model's setting without a second decision.
#
# It is a default, not a recommendation. Nine other encoders are registered and none is claimed to
# be worse; this package does not train or evaluate a downstream model, so it has no basis for
# ranking them and makes no such claim. Choosing between encoders for a given task is the caller's
# experiment to run.
#
# The choice matters less than it looks. This package's primary signal is RSA + contacts (D1-D3),
# computed from structure and independent of this key entirely; `model: none` skips the embedding
# altogether. Per-model dims come from embedding.py's registry (EMBEDDING_MODELS), not this file.
#   ankh        — Ankh-large, T5 encoder, 1536-d            (default)
#   ankh3_large — Ankh3-large, T5 encoder, 1536-d           ([NLU] prefix)
#   ankh3_xl    — Ankh3-XL, T5 encoder, 2560-d              ([NLU] prefix)
#   prostt5_aa  — ProstT5, bilingual checkpoint in amino-acid mode, 1024-d
#   saprot      — SaProt 650M, structure-aware AA+3Di, 1280-d (3Di via mini3di)
#   saprot_1.3b — SaProt 1.3B, structure-aware, 1280-d      (deeper, not wider)
#   esm2_3b     — ESM2-3B, 2560-d                           (widely used reference)
#   esm2_650m   — ESM2-650M, 1280-d                         (lighter)
#   esmc_600m   — ESM C 600M, 1152-d                        (via the `esm` SDK, [esmc] extra)
#   esmc_6b     — ESM C 6B, 2560-d                          (no load path here, on any platform:
#                                                            see the note below — use esmc_600m)
#   none        — skip the embedding
#
# On esmc_6b: it is registered for dimensional reference, and has no working path here.
# Not a version problem -- the HF `esmc` model_type is in no released transformers, and the `esm`
# SDK registry omits the 6B, so neither of this package's two load paths reaches it and no
# upgrade changes that. It has been run elsewhere by hand-building the module and loading the
# safetensors shards directly (CUDA, bf16, ~12 GB), which is outside what foldenv does. Use
# `esmc_600m` through the `esm` SDK. `mps_ok=False` on the entry is inert as a result: nothing
# has ever reached device selection, so it records no measurement about Apple Silicon.

embedding:
  model: ankh
  device: auto           # auto | cpu | cuda | mps. ESM C 6B is never placed on MPS
                         # (mps_ok=False in embedding.EMBEDDING_MODELS) — it reroutes to
                         # CUDA/CPU instead.

# D6 — DSSP version. mkdssp 4 defaults to mmCIF, which breaks Biopython's legacy-format
# parser; force the legacy text format.
dssp:
  executable: mkdssp
  # Documents the D6 resolution; not consumed directly — dssp.py detects mkdssp's version and
  # hands it to Biopython (>=1.80), which then injects `--output-format=dssp` for v4.
  output_format: dssp

# Structure source.
alphafold:
  api_base: https://alphafold.ebi.ac.uk/api/prediction
  file_version: null     # null → use whatever the API returns (don't hardcode v4)
